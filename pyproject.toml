[project]
name = "jobagent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pypdf", "langchain-core", "langchain-groq", "playwright", "beautifulsoup4", "rapidfuzz",
    "python-dateutil", "pyyaml", "reportlab", "pandas", "openpyxl"]

[project.scripts]
jobagent = "jobagent.cli:main"

[project.optional-dependencies]
ui = ["streamlit", "pandas"]
dev = ["pytest", "reportlab", "streamlit", "pandas", "pillow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
