[project]
name = "jobagent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pypdf", "langchain-core", "langchain-groq"]

[project.optional-dependencies]
dev = ["pytest", "reportlab"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
